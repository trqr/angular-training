<section >
  <div class="list-title">
    <h2>Nos produits</h2>
  </div>
  <div class="product-list">
    @for (product of products; track $index){
      <app-product-card
        [product]="product"
        (addToCart)="added.emit($event)"
        (removeFromCart)="removed.emit($event)"
        [quantity]="getProductQuantity(product)"
      />
    }
  </div>
</section>
