<button
  class="button"
  [type]="type()"
  [disabled]="disabled()"
  [class.contained]="variant() === 'contained'"
  [class.outlined]="variant() === 'outlined'"
  [class.ghost]="variant() === 'ghost'"
  [class.primary]="color() === 'primary'"
  [class.secondary]="color() === 'secondary'"
>
  <ng-content></ng-content>
</button>
