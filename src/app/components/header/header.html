<header class="header">
  <a class="logo" routerLink="/">
    <h1>Training Shop</h1>
    <p>Le catalogue d'entraînement</p>
  </a>
  <nav class="header-menu" aria-label="Navigation principale">
    <a class="menu-item" routerLink="/">Accueil</a>
    <a class="menu-item" routerLink="/products/new">Ajouter un produit</a>
  </nav>
  <div class="header-right-box">
    <div class="cart">
      <a class="cart-link" routerLink="/cart">
        <span aria-live="polite" aria-atomic="true">{{ cartLabel() }}</span>
      </a>
      <app-button color="primary" variant="ghost" [disabled]="!cartService.count()" (click)="cartService.clear()">
        Vider le panier
      </app-button>
    </div>
    <a class="menu-item" routerLink="/account">Mon compte</a>
  </div>
</header>
