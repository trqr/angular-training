<article class="product-card" >
  <a [routerLink]="['/products', product().id]">
    <img
    [src]="product().thumbnail"
    [alt]="product().title"
    />
    <h3>{{product().title}}</h3>
    <p>{{product().price}} €</p>
  </a>
  <div class="addtocard-action">
    <app-button
      variant="contained"
      [ariaLabel]="'Retirer ' + product().title + ' du panier'"
      (click)="onRemoveClick()"
    >
      Retirer
    </app-button>
    <app-button
      variant="contained"
      [ariaLabel]="'Ajouter ' + product().title + ' au panier'"
      (click)="onAddClick()"
    >
      Ajouter au panier
    </app-button>
  </div>
  @if (quantity() > 0) {
    <p class="added-popup" role="status">
      Vous avez ajouté {{ quantity() }} {{ product().title }} au panier.
    </p>
  }
</article>
